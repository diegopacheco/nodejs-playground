<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memory Game</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: radial-gradient(circle at top, #4c1d95, #1e1b4b 65%);
      color: #f5f3ff;
    }
    h1 {
      margin: 0;
      font-size: 2.4rem;
      letter-spacing: 1px;
    }
    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 110px);
      grid-gap: 14px;
      padding: 20px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
    }
    .card {
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      cursor: pointer;
      user-select: none;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.25) 0 10px, transparent 11px),
        repeating-linear-gradient(45deg, #6d28d9 0 10px, #7c3aed 10px 20px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35), inset 0 0 0 5px rgba(255, 255, 255, 0.08);
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.45), 0 0 18px rgba(167, 139, 250, 0.5);
    }

    .card.flipping {
      transform: scaleX(0);
    }

    .card.flipped {
      background: linear-gradient(145deg, #ffffff, #ede9fe);
      border-color: #c4b5fd;
    }

    .card.matched {
      background: linear-gradient(145deg, #6ee7b7, #10b981);
      border-color: #a7f3d0;
      cursor: default;
      box-shadow: 0 0 22px rgba(16, 185, 129, 0.6);
      animation: matchPulse 0.6s ease-in-out;
    }

    @keyframes matchPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .card.wrong {
      background: linear-gradient(145deg, #fda4af, #e11d48);
      border-color: #fecdd3;
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .hidden {
      visibility: hidden;
    }
    .status {
      font-size: 1.2rem;
      font-weight: bold;
      padding: 8px 22px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <h1>🎴 Memory Game</h1>
  <div class="status" id="status">Mistakes: 0</div>
  <div class="game-board" id="board"></div>

  <script>
    const symbols = ['🎯', '🎮', '🎲', '🐉', '🏰', '🦀'];
    let cards = [...symbols, ...symbols].sort(() => 0.5 - Math.random());
    const board = document.getElementById('board');
    let flipped = [];
    let matchedCount = 0;
    let mistakes = 0;
    const status = document.getElementById('status');

    function renderBoard() {
      board.innerHTML = '';
      cards.forEach((symbol, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = index;
        card.dataset.symbol = symbol;
        card.addEventListener('click', flipCard);
        board.appendChild(card);
      });
    }

    function flipCard(e) {
      const card = e.target;
      if (card.classList.contains('flipped') || card.classList.contains('matched') || flipped.length >= 2) return;
      card.classList.add('flipping');
      setTimeout(() => {
        card.textContent = card.dataset.symbol;
        card.classList.remove('flipping');
        card.classList.add('flipped');
        flipped.push(card);
        if (flipped.length === 2) {
          setTimeout(checkMatch, 1000);
        }
      }, 150);
    }

    function checkMatch() {
      const [card1, card2] = flipped;
      if (card1.dataset.symbol === card2.dataset.symbol) {
        card1.classList.remove('flipped');
        card2.classList.remove('flipped');
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedCount += 2;
        if (matchedCount === cards.length) {
          status.textContent = '🎉 You Win!';
          status.style.color = '#4CAF50';
        }
      } else {
        card1.classList.add('wrong');
        card2.classList.add('wrong');
        setTimeout(() => {
          card1.textContent = '';
          card2.textContent = '';
          card1.classList.remove('flipped', 'wrong');
          card2.classList.remove('flipped', 'wrong');
          mistakes++;
          if (mistakes >= 3) {
            status.textContent = '💥 Game Over!';
            status.style.color = '#f44336';
            Array.from(document.querySelectorAll('.card')).forEach(c => c.removeEventListener('click', flipCard));
            return;
          }
          status.textContent = `Mistakes: ${mistakes}`;
        }, 600);
      }
      flipped = [];
    }
    renderBoard();
  </script>
</body>
</html>
