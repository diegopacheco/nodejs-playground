<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Space Invader</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>SPACE INVADER</h1>
    <canvas id="game" width="960" height="640"></canvas>
    <div id="status">Score: 0</div>
    <div id="game-over">GAME OVER!</div>
    <p class="hint">← → move · Space fire</p>
    <audio id="backgroundMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>
    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const statusDiv = document.getElementById("status");
        const gameOverDiv = document.getElementById("game-over");
        const backgroundMusic = document.getElementById("backgroundMusic");

        const W = 480;
        const H = 320;
        ctx.scale(canvas.width / W, canvas.height / H);

        const enemyImage = new Image();
        enemyImage.src = 'space-invaders-icon.png';
        let imageLoaded = false;
        enemyImage.onload = function () {
            imageLoaded = true;
        };

        const playerImage = new Image();
        playerImage.src = 'ship.png';
        let playerImageLoaded = false;
        playerImage.onload = function () {
            playerImageLoaded = true;
        };

        let player = { x: 220, y: 280, width: 40, height: 10 };
        let bullets = [];
        let enemies = [];
        let enemyBullets = [];
        let particles = [];
        let leftPressed = false;
        let rightPressed = false;
        let score = 0;
        let enemyDirection = 1;
        let gameOver = false;
        let frameCount = 0;

        const stars = Array.from({ length: 90 }, () => ({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 1.4 + 0.3
        }));

        document.addEventListener("keydown", (e) => {
            if (backgroundMusic.paused) {
                backgroundMusic.play().catch(console.error);
            }
            if (e.key === "ArrowLeft") leftPressed = true;
            if (e.key === "ArrowRight") rightPressed = true;
            if (e.key === " ") bullets.push({ x: player.x + player.width / 2 - 2, y: player.y });
        });

        function spawnEnemies() {
            enemies = [];
            for (let i = 0; i < 5; i++) {
                enemies.push({ x: i * 80 + 20, y: 30, width: 30, height: 15 });
            }
        }

        function drawRect(obj, color) {
            ctx.fillStyle = color;
            ctx.fillRect(obj.x, obj.y, obj.width || 4, obj.height || 10);
        }

        function drawLaser(b, color) {
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(b.x, b.y, 4, 10, 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawBackground() {
            const sky = ctx.createLinearGradient(0, 0, 0, H);
            sky.addColorStop(0, "#020617");
            sky.addColorStop(1, "#1e1b4b");
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = "#ffffff";
            stars.forEach(s => {
                if (!gameOver) s.y += s.size * 0.3;
                if (s.y > H) {
                    s.y = 0;
                    s.x = Math.random() * W;
                }
                ctx.globalAlpha = s.size / 1.7;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawPlayer() {
            const cx = player.x + player.width / 2;
            const flame = 6 + Math.sin(frameCount * 0.4) * 2;
            const glow = ctx.createRadialGradient(cx, player.y + 12, 0, cx, player.y + 12, flame + 4);
            glow.addColorStop(0, "rgba(125, 211, 252, 0.9)");
            glow.addColorStop(1, "rgba(56, 189, 248, 0)");
            ctx.fillStyle = glow;
            ctx.fillRect(cx - 12, player.y + 4, 24, flame + 16);
            if (playerImageLoaded) {
                ctx.drawImage(playerImage, player.x + 6, player.y - 18, 28, 28);
            } else {
                drawRect(player, "lime");
            }
        }

        function drawBullets() {
            bullets.forEach((b, i) => {
                drawLaser(b, "#38bdf8");
                b.y -= 5;
                if (b.y < 0) bullets.splice(i, 1);
            });
        }

        function drawEnemyBullets() {
            enemyBullets.forEach((b, i) => {
                drawLaser(b, "#fb923c");
                b.y += 3;
                if (b.y > H) enemyBullets.splice(i, 1);
            });
        }

        function drawEnemies() {
            enemies.forEach((e, i) => {
                const bob = Math.sin(frameCount * 0.08 + i) * 1.5;
                ctx.shadowColor = "#a3e635";
                ctx.shadowBlur = 8;
                if (imageLoaded) {
                    ctx.drawImage(enemyImage, e.x + 2, e.y - 2 + bob, 26, 19);
                } else {
                    drawRect(e, "white");
                }
                ctx.shadowBlur = 0;
            });
        }

        function burst(x, y, color) {
            for (let i = 0; i < 18; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2 + 0.5;
                particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 35, color });
            }
        }

        function drawParticles() {
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.globalAlpha = p.life / 35;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 2, 2);
            });
            ctx.globalAlpha = 1;
        }

        function moveEnemies() {
            if (frameCount % 60 === 0) {
                let hitEdge = enemies.some(e => (e.x + e.width >= W || e.x <= 0));
                enemies.forEach(e => e.x += enemyDirection * 2);
                if (hitEdge) {
                    enemyDirection *= -1;
                    enemies.forEach(e => e.y += 5);
                }
            }
        }

        function enemyFire() {
            if (Math.random() < 0.02 && enemies.length > 0) {
                const e = enemies[Math.floor(Math.random() * enemies.length)];
                enemyBullets.push({ x: e.x + e.width / 2 - 2, y: e.y });
            }
        }

        function endGame() {
            if (!gameOver) burst(player.x + player.width / 2, player.y, "#38bdf8");
            gameOver = true;
            backgroundMusic.pause();
        }

        function checkCollisions() {
            bullets.forEach((b, bi) => {
                enemies.forEach((e, ei) => {
                    if (
                        b.x < e.x + e.width &&
                        b.x + 4 > e.x &&
                        b.y < e.y + e.height &&
                        b.y + 10 > e.y
                    ) {
                        burst(e.x + e.width / 2, e.y + e.height / 2, "#a3e635");
                        enemies.splice(ei, 1);
                        bullets.splice(bi, 1);
                        score += 100;
                        statusDiv.textContent = "Score: " + score;
                    }
                });
            });

            enemyBullets.forEach((b, bi) => {
                if (
                    b.x < player.x + player.width &&
                    b.x + 4 > player.x &&
                    b.y < player.y + player.height &&
                    b.y + 10 > player.y
                ) {
                    endGame();
                }
            });

            enemies.forEach(e => {
                if (e.y + e.height >= player.y) {
                    endGame();
                }
            });
        }

        function drawScore() {
            ctx.fillStyle = "#a5f3fc";
            ctx.shadowColor = "#38bdf8";
            ctx.shadowBlur = 8;
            ctx.font = "bold 14px monospace";
            ctx.fillText("SCORE " + String(score).padStart(5, "0"), 10, 20);
            ctx.shadowBlur = 0;
        }

        function drawGameOver() {
            ctx.fillStyle = "rgba(2, 6, 23, 0.7)";
            ctx.fillRect(0, 0, W, H);
            ctx.textAlign = "center";
            ctx.fillStyle = "#f472b6";
            ctx.shadowColor = "#f472b6";
            ctx.shadowBlur = 16;
            ctx.font = "bold 34px monospace";
            ctx.fillText("GAME OVER!", W / 2, H / 2);
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#e0f2fe";
            ctx.font = "14px monospace";
            ctx.fillText("Final score " + score, W / 2, H / 2 + 30);
            ctx.textAlign = "left";
        }

        function update() {
            drawBackground();

            if (!gameOver) {
                frameCount++;
                if (leftPressed && player.x > 0) player.x -= 5;
                if (rightPressed && player.x < W - player.width) player.x += 5;
                drawPlayer();
                drawBullets();
                drawEnemyBullets();
                drawEnemies();
                drawParticles();
                drawScore();
                moveEnemies();
                enemyFire();
                checkCollisions();
                if (enemies.length === 0) spawnEnemies();
                requestAnimationFrame(update);
            } else if (particles.length > 0) {
                drawEnemies();
                drawParticles();
                drawScore();
                requestAnimationFrame(update);
            } else {
                drawEnemies();
                drawScore();
                drawGameOver();
            }
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") leftPressed = true;
            if (e.key === "ArrowRight") rightPressed = true;
            if (e.key === " ") bullets.push({ x: player.x + player.width / 2 - 2, y: player.y });
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft") leftPressed = false;
            if (e.key === "ArrowRight") rightPressed = false;
        });

        spawnEnemies();
        update();
    </script>
</body>
</html>
