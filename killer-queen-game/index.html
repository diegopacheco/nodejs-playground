<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Killer Queen</title>
    <style>
        html,
        body {
            overflow: hidden;
            margin: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #2e1065, #0a0a0a 70%);
            color: #f5f5f4;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #facc15, #38bdf8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        canvas {
            display: block;
            margin: 0 auto;
            background-color: black;
            border-radius: 14px;
            border: 2px solid rgba(250, 204, 21, 0.4);
            box-shadow: 0 0 40px rgba(124, 58, 237, 0.35), 0 20px 60px rgba(0, 0, 0, 0.6);
            max-height: calc(100vh - 70px);
            width: auto;
        }
    </style>
</head>

<body>
    <h1>KILLER QUEEN</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const TEAM_COLORS = {
            gold: { main: "#facc15", dark: "#a16207", glow: "rgba(250, 204, 21, 0.35)" },
            blue: { main: "#38bdf8", dark: "#0369a1", glow: "rgba(56, 189, 248, 0.35)" },
        };

        const yellowQueenImg = new Image();
        yellowQueenImg.src = 'yellow-queen.png';

        const blueQueenImg = new Image();
        blueQueenImg.src = 'blue-queen.png';

        const keys = {};
        document.addEventListener("keydown", e => {
            keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
            if (e.key.startsWith("Arrow")) e.preventDefault();
        });
        document.addEventListener("keyup", e => {
            keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false;
        });

        function prerender(img, width, height) {
            const layer = document.createElement("canvas");
            layer.width = width;
            layer.height = height;
            layer.getContext("2d").drawImage(img, 0, 0, width, height);
            return layer;
        }

        let bgLayer, yellowQueenLayer, blueQueenLayer;
        const bg = new Image();
        bg.src = 'killer-queen-bg.png';
        const images = [bg, yellowQueenImg, blueQueenImg].map(img => img.decode());
        Promise.all(images).then(() => {
            bgLayer = prerender(bg, canvas.width, canvas.height);
            yellowQueenLayer = prerender(yellowQueenImg, 64, 64);
            blueQueenLayer = prerender(blueQueenImg, 64, 64);
            startGame();
        });

        function startGame() {
            const game = {
                players: [],
                berries: [],
                hive: { x: 700, y: 250, width: 40, height: 100 },
                gates: [{ x: 300, y: 200 }, { x: 300, y: 400 }],
                winCondition: {
                    berries: 5,
                    queenKills: 3,
                },
                scores: {
                    gold: { berries: 0, queenKills: 0 },
                    blue: { berries: 0, queenKills: 0 },
                },
                running: true,
            };

            class Player {
                constructor(x, y, color, isQueen = false) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.radius = 10;
                    this.speed = isQueen ? 220 : 180;
                    this.isQueen = isQueen;
                    this.hasBerry = false;
                    this.alive = true;
                }

                move(dx, dy) {
                    if (!this.alive) return;
                    this.x += dx * this.speed;
                    this.y += dy * this.speed;
                    this.x = Math.max(0, Math.min(canvas.width, this.x));
                    this.y = Math.max(0, Math.min(canvas.height, this.y));
                }

                draw() {
                    if (!this.alive) return;
                    const team = TEAM_COLORS[this.color];
                    if (this.isQueen) {
                        const img = this.color === 'gold' ? yellowQueenLayer : blueQueenLayer;
                        ctx.fillStyle = team.glow;
                        ctx.beginPath();
                        ctx.ellipse(this.x, this.y + 14, 16, 5, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = team.glow;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, 20, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.drawImage(img, this.x - 16, this.y - 16, 32, 32);
                    } else {
                        const flap = Math.sin(performance.now() / 40) * 3;
                        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
                        ctx.beginPath();
                        ctx.ellipse(this.x - 5, this.y - 9, 5, 7 + flap / 2, -0.4, 0, Math.PI * 2);
                        ctx.ellipse(this.x + 5, this.y - 9, 5, 7 - flap / 2, 0.4, 0, Math.PI * 2);
                        ctx.fill();
                        const body = ctx.createRadialGradient(this.x - 3, this.y - 3, 1, this.x, this.y, this.radius);
                        body.addColorStop(0, "#ffffff");
                        body.addColorStop(0.3, team.main);
                        body.addColorStop(1, team.dark);
                        ctx.fillStyle = team.glow;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius + 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = body;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
                        ctx.fillRect(this.x - 8, this.y - 1, 16, 3);
                        ctx.fillRect(this.x - 6, this.y + 4, 12, 2);
                        if (this.hasBerry) {
                            drawBerry(this.x, this.y - 18, 5);
                        }
                    }
                }
            }

            function drawBerry(x, y, radius) {
                ctx.fillStyle = "rgba(253, 186, 116, 0.35)";
                ctx.beginPath();
                ctx.arc(x, y, radius + 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#fb923c";
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
                ctx.beginPath();
                ctx.arc(x - radius / 3, y - radius / 3, radius / 3, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawHive() {
                const hive = game.hive;
                ctx.fillStyle = "rgba(168, 85, 247, 0.3)";
                ctx.beginPath();
                ctx.roundRect(hive.x - 10, hive.y - 10, hive.width + 20, hive.height + 20, 14);
                ctx.fill();
                ctx.fillStyle = "rgba(76, 29, 149, 0.8)";
                ctx.beginPath();
                ctx.roundRect(hive.x - 4, hive.y - 4, hive.width + 8, hive.height + 8, 10);
                ctx.fill();
                const r = 6;
                const w = Math.sqrt(3) * r;
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 2; col++) {
                        const cx = hive.x + w / 2 + 3 + col * w + (row % 2) * (w / 2);
                        const cy = hive.y + r + 4 + row * r * 1.5;
                        ctx.beginPath();
                        for (let k = 0; k < 6; k++) {
                            const a = Math.PI / 6 + (k * Math.PI) / 3;
                            ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
                        }
                        ctx.closePath();
                        ctx.fillStyle = "#facc15";
                        ctx.fill();
                        ctx.strokeStyle = "#a16207";
                        ctx.stroke();
                    }
                }
                ctx.fillStyle = "#f5f3ff";
                ctx.font = "bold 11px system-ui";
                ctx.textAlign = "center";
                ctx.fillText("HIVE", hive.x + hive.width / 2, hive.y - 10);
                ctx.textAlign = "left";
            }

            function drawScorePanel(team, label, y) {
                const colors = TEAM_COLORS[team];
                const score = game.scores[team];
                ctx.fillStyle = "rgba(10, 10, 10, 0.65)";
                ctx.beginPath();
                ctx.roundRect(10, y, 230, 30, 8);
                ctx.fill();
                ctx.fillStyle = colors.main;
                ctx.fillRect(10, y + 6, 4, 18);
                ctx.font = "bold 14px system-ui";
                ctx.fillText(label, 22, y + 20);
                ctx.fillStyle = "#f5f5f4";
                ctx.font = "13px system-ui";
                ctx.fillText(score.berries + " berries · " + score.queenKills + " kills", 80, y + 20);
            }

            function spawnBerries() {
                for (let i = 0; i < 10; i++) {
                    game.berries.push({
                        x: Math.random() * 700,
                        y: Math.random() * 500,
                        radius: 5,
                        taken: false,
                    });
                }
            }

            function checkCollisions(player) {
                if (!player.alive) return;

                for (const berry of game.berries) {
                    if (!berry.taken && Math.hypot(player.x - berry.x, player.y - berry.y) < player.radius + berry.radius) {
                        berry.taken = true;
                        player.hasBerry = true;
                    }
                }

                const hive = game.hive;
                if (
                    player.hasBerry &&
                    player.x > hive.x &&
                    player.x < hive.x + hive.width &&
                    player.y > hive.y &&
                    player.y < hive.y + hive.height
                ) {
                    player.hasBerry = false;
                    game.scores[player.color].berries++;
                }

                for (const other of game.players) {
                    if (
                        other !== player &&
                        player.isQueen &&
                        other.isQueen &&
                        other.color !== player.color &&
                        other.alive &&
                        Math.hypot(player.x - other.x, player.y - other.y) < player.radius * 2
                    ) {
                        other.alive = false;
                        game.scores[player.color].queenKills++;
                    }
                }
            }

            function drawGame() {
                ctx.drawImage(bgLayer, 0, 0);

                drawHive();

                const t = performance.now() / 400;
                for (const berry of game.berries) {
                    if (!berry.taken) {
                        drawBerry(berry.x, berry.y + Math.sin(t + berry.x) * 2, berry.radius);
                    }
                }

                for (const p of game.players) {
                    p.draw();
                }

                drawScorePanel("gold", "Gold", 10);
                drawScorePanel("blue", "Blue", 46);

                ctx.fillStyle = "rgba(10, 10, 10, 0.6)";
                ctx.beginPath();
                ctx.roundRect(canvas.width / 2 - 170, canvas.height - 36, 340, 26, 13);
                ctx.fill();
                ctx.fillStyle = "#d6d3d1";
                ctx.font = "12px system-ui";
                ctx.textAlign = "center";
                ctx.fillText("Gold worker: Arrow keys  ·  Gold queen: W A S D", canvas.width / 2, canvas.height - 19);
                ctx.textAlign = "left";
            }

            let lastTime = performance.now();

            function moveFromKeys(player, up, down, left, right, dt) {
                const dx = (keys[right] ? 1 : 0) - (keys[left] ? 1 : 0);
                const dy = (keys[down] ? 1 : 0) - (keys[up] ? 1 : 0);
                if (dx === 0 && dy === 0) return;
                const len = Math.hypot(dx, dy);
                player.move((dx / len) * dt, (dy / len) * dt);
            }

            function updateGame(now = performance.now()) {
                const dt = Math.max(0, Math.min(0.05, (now - lastTime) / 1000));
                lastTime = now;
                moveFromKeys(game.players[0], "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", dt);
                moveFromKeys(game.players[1], "w", "s", "a", "d", dt);
                for (const p of game.players) {
                    checkCollisions(p);
                }
                drawGame();
                requestAnimationFrame(updateGame);
            }

            function setupGame() {
                game.players.push(new Player(50, 100, "gold"));
                game.players.push(new Player(100, 100, "gold", true));
                game.players.push(new Player(50, 300, "blue"));
                game.players.push(new Player(100, 300, "blue", true));
                spawnBerries();
                updateGame();
            }

            setupGame();
        }
    </script>
</body>
</html>
